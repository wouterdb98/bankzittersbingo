
<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Groepen Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    color: white;

    background:
        linear-gradient(
            rgba(0,0,0,0.45),
            rgba(0,0,0,0.45)
        ),
        url("achtergrond.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

    
.afbeelding {
    text-align: center;
    margin-top: -5px;
}

.afbeelding img {
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4));
}

.beloningen {
    width: 100%;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    align-items: flex-end;   /* afbeelding onderaan */
    justify-content: center;
    margin-bottom: 20px;
}

.beloningen img {
    display: block;
    width: 100%;
    height: auto;
}

.container {
    max-width: 1000px;
    margin: auto;
}

h1 {
    text-align: center;
}

.card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(8px);

    border-radius: 16px;

    padding: 20px;

    margin-bottom: 20px;
}

.stats {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.stat {
    flex: 1;
    min-width: 0;
    text-align: center;
    background: rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 15px;
}

.stat h2 {
    margin: 0;
    font-size: 2rem;
}

.dashboard-titel {
    color: #FFD700;
    text-shadow: 0 2px 10px rgba(0,0,0,0.6);
}

.stat.volgers {
    background: rgba(52, 152, 219, 0.25);
    border: 2px solid rgba(52, 152, 219, 0.6);
}

.stat.volgers h2 {
    color: #74c7ff;
}

.stat.positie {
    background: rgba(46, 204, 113, 0.25);
    border: 2px solid rgba(46, 204, 113, 0.6);
}

.stat.positie h2 {
    color: #6dff9b;
}

.stat.positie {
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    transition: all 0.3s ease;
}

/* 🥇 1e */
.stat.positie.goud {
    background: rgba(255, 215, 0, 0.25);
    border-color: #FFD700;
}

.stat.positie.goud h2 {
    color: #FFD700;
}

/* 🥈 2e */
.stat.positie.zilver {
    background: rgba(192, 192, 192, 0.25);
    border-color: #C0C0C0;
}

.stat.positie.zilver h2 {
    color: #E8E8E8;
}

/* 🥉 3e */
.stat.positie.brons {
    background: rgba(205, 127, 50, 0.25);
    border-color: #CD7F32;
}

.stat.positie.brons h2 {
    color: #E5A66F;
}

canvas {
    width: 100%;
    max-height: 500px;
}

</style>
</head>

<body>

<div class="container">

    <h1 id="titel" class="dashboard-titel">Dashboard laden...</h1>

    <div class="card">
        <canvas id="grafiek"></canvas>
    </div>

    <div class="stats">

        <div class="stat volgers">
            <h2 id="volgers">...</h2>
            <p>Volgers</p>
        </div>

        <div class="stat positie" id="positieBlok">
            <h2 id="positie">...</h2>
            <p>Positie</p>
        </div>

    </div>

    
    <div class="afbeelding">
        <img src="teamfoto.png" alt="Teamfoto">
    </div>

    <div class="beloningen">
        <img src="bingobeloning.jpg" alt="Bingobeloningen">
    </div>

    <div class="beloningen">
        <img src="snelheidsbeloning.jpg" alt="Snelheidsbeloning">
    </div>
    
</div>

<script>


const params = new URLSearchParams(window.location.search);

const MIJN_GROEP =
    Number(params.get("groep"))

const API_URL =
"https://script.google.com/macros/s/AKfycbw9tZRdzZBMNnFUp7K_G5ttaXZu-ZDdicDTk9-qxjffaaQxJe1PvRMiA-5O262GCnc/exec";

const nu = new Date();

const verbergenVanaf = new Date();
verbergenVanaf.setHours(12, 40, 0, 0);

const bingoEinde = new Date();
bingoEinde.setHours(12, 42, 0, 0);

const dashboardTerug = new Date();
dashboardTerug.setHours(12, 44, 0, 0);

if (nu >= verbergenVanaf && nu < dashboardTerug) {

    function toonScherm() {

        const nu = new Date();

        // 14:00 - 14:30
        if (nu < bingoEinde) {

            const verschil = bingoEinde - nu;

            const minuten = Math.floor(verschil / 1000 / 60);
            const seconden = Math.floor((verschil / 1000) % 60);

            document.body.innerHTML = `
                <div style="
                    display:flex;
                    flex-direction:column;
                    justify-content:center;
                    align-items:center;
                    height:100vh;
                    color: #FFD700;
                    text-shadow: 0 2px 10px rgba(0,0,0,0.6);
                    text-align:center;
                    font-family:Arial,sans-serif;
                ">
                    <h1>Bankzitters Bingo Battle Eindsprint! 🏁</h1>

                    <p>
                        Het klassement is verborgen tot de prijsuitreiking. Tot 14:30 kunnen jullie nog Bingo inleveren bij de CP!
                    </p>

                <div style="
                    background:rgba(0,0,0,0.35);
                    border:3px solid #FFD700;
                    border-radius:20px;
                    padding:20px 40px;
                    margin:20px 0;
                    box-shadow:0 0 20px rgba(255,215,0,0.3);
                ">
                    <h2 style="
                        margin:0;
                        font-size:4rem;
                        color:#FFD700;
                    ">
                        ${minuten}:${String(seconden).padStart(2,"0")}
                    </h2>
                </div>

                </div>
                
                <div class="beloningen">
                    <img src="bingobeloning.jpg" alt="Bingobeloningen">
                </div>

                <div class="beloningen">
                    <img src="snelheidsbeloning.jpg" alt="Snelheidsbeloning">
                </div>
            `;

        // 14:30 - 15:05
        } else {

            document.body.innerHTML = `
                <div style="
                    display:flex;
                    flex-direction:column;
                    justify-content:center;
                    align-items:center;
                    height:100vh;
                    color:white;
                    text-align:center;
                    font-family:Arial,sans-serif;
                ">
                    <h1>🚶 Bingo afgelopen!</h1>

                    <p style="max-width:600px;font-size:1.2rem;">
                        We lopen terug naar het KVW-terrein voor de
                        prijsuitreiking.
                    </p>

                    <p>
                        Na de prijsuitreiking kun je de eindstand weer bekijken
                        op je dashboard.
                    </p>
                </div>
            `;
        }

        // Dashboard weer open om 15:05
        if (nu >= dashboardTerug) {
            location.reload();
        }
    }

    toonScherm();
    setInterval(toonScherm, 1000);

    throw new Error("Dashboard verborgen");
}

fetch(API_URL + "?groep=" + MIJN_GROEP)

.then(response => response.json())

.then(data => {

    document.getElementById("titel").textContent =
        data.leeftijd + " - Groep " + data.groep;

    document.getElementById("volgers").textContent =
        data.volgers;

    const positieBlok = document.getElementById("positieBlok");
    const positie = Number(data.positie);

    let positieTekst = positie + "e";

    if (positie === 1) {
        positieTekst = "🥇 1e";
        positieBlok.classList.add("goud");
    } 
    else if (positie === 2) {
        positieTekst = "🥈 2e";
        positieBlok.classList.add("zilver");
    } 
    else if (positie === 3) {
        positieTekst = "🥉 3e";
        positieBlok.classList.add("brons");
    }

    document.getElementById("positie").textContent = positieTekst;

    const labels =
        data.groepen.map(x => x.groep);

    const volgers =
        data.groepen.map(x => x.volgers);

    const kleuren =
        labels.map(g =>
            g == MIJN_GROEP
                ? "#FFD700"
                : "rgba(255,255,255,0.6)"
        );

    new Chart(
        document.getElementById("grafiek"),
        {
            type: "bar",

            data: {
                labels: labels,

                datasets: [{
                    label: "Volgers",

                    data: volgers,

                    backgroundColor: kleuren,

                    borderRadius: 6
                }]
            },

            options: {

                responsive: true,

                plugins: {

                    legend: {
                        display: false
                    }

                },

                scales: {

                    x: {
                        title: {
                            display: true,
                            text: "Groepnummer",
                            color: "white",
                            font: {
                                size: 16,
                                weight: "bold"
                            }
                        },
                        ticks: {
                            color: "white"
                        },

                        grid: {
                            display: false
                        }
                    },

                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: "Aantal volgers",
                            color: "white",
                            font: {
                                size: 16,
                                weight: "bold"
                            }
                        },
                        ticks: {
                            color: "white"
                        },

                        grid: {
                            color: "rgba(255,255,255,0.15)"
                        }
                    }

                }

            }

        }
    );

})

.catch(error => {

    document.getElementById("titel").textContent =
        "Fout bij laden";

    console.error(error);

});

</script>

</body>
</html>
