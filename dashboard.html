
<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Groepen Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    color: white;

    background:
        linear-gradient(
            rgba(0,0,0,0.45),
            rgba(0,0,0,0.45)
        ),
        url("achtergrond.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}


/* Teamfoto */
.afbeelding {
    text-align: center;
    margin-top: -5px;
}

.afbeelding img {
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4));
}


/* Beloningen */
.beloningen {
    width: 100%;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    margin-bottom: 20px;
}

.beloningen img {
    display: block;
    width: 100%;
    height: auto;
}


/* Container */
.container {
    max-width: 1000px;
    margin: auto;
}


/* Algemene titel */
h1 {
    text-align: center;
}


/* Grafiek-kaart */
.card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(8px);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
}


/* Statistieken naast elkaar */
.stats {
    display: flex;
    flex-direction: row;
    gap: 10px;
    width: 100%;
}


/* Algemene statistiek-blokken */
.stat {
    flex: 1;
    min-width: 0;
    text-align: center;
    border-radius: 12px;
    padding: 15px;
    box-sizing: border-box;
}


/* Grote waarde */
.stat h2 {
    margin: 0;
    font-size: 2rem;
}


/* Kleine labels onder de waarde */
.stat p {
    margin: 8px 0 0;

    font-size: 0.9rem;
    font-weight: bold;

    text-transform: uppercase;
    letter-spacing: 1.5px;

    opacity: 0.8;
}


/* Dashboard titel */
.logo {
    text-align: center;
    margin-bottom: 5px;
}

.logo img {
    width: 100%;
    max-width: 600px;
    height: auto;
    display: block;
    margin: 0 auto;
}

.dashboard-titel {
    color: #FFD700;
    text-align: center;
    margin: 0 0 20px;
    font-size: 1.8rem;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
}


/* =========================
   VOLGERS
   ========================= */

.stat.volgers {
    background: rgba(52, 152, 219, 0.25);
    border: 2px solid rgba(52, 152, 219, 0.6);
}

.stat.volgers h2 {
    color: #74c7ff;
}

.stat.volgers p {
    color: #b9e3ff;
}


/* =========================
   POSITIE - 4e en lager
   ========================= */

.stat.positie {
    background: rgba(46, 204, 113, 0.25);
    border: 2px solid rgba(46, 204, 113, 0.6);
    transition: all 0.3s ease;
}

.stat.positie h2 {
    color: #6dff9b;
}

.stat.positie p {
    color: #b8f5c9;
}


/* =========================
   🥇 1e plaats
   ========================= */

.stat.positie.goud {
    background: rgba(255, 215, 0, 0.25);
    border-color: #FFD700;
}

.stat.positie.goud h2 {
    color: #FFD700;
}

.stat.positie.goud p {
    color: #ffe98a;
}


/* =========================
   🥈 2e plaats
   ========================= */

.stat.positie.zilver {
    background: rgba(192, 192, 192, 0.25);
    border-color: #C0C0C0;
}

.stat.positie.zilver h2 {
    color: #E8E8E8;
}

.stat.positie.zilver p {
    color: #d5d5d5;
}


/* =========================
   🥉 3e plaats
   ========================= */

.stat.positie.brons {
    background: rgba(205, 127, 50, 0.25);
    border-color: #CD7F32;
}

.stat.positie.brons h2 {
    color: #E5A66F;
}

.stat.positie.brons p {
    color: #f0c49b;
}


/* Grafiek */
canvas {
    width: 100%;
    max-height: 500px;
}

/* =========================
   COUNTDOWN SCHERM
   ========================= */

.countdown-scherm {
    min-height: 100vh;
    box-sizing: border-box;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding: 20px;

    text-align: center;
}

.countdown-content {
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    transform: translateY(-90px);
}


/* Logo tijdens countdown */
.countdown-logo {
    width: 100%;
    max-width: 600px;
    margin: 0 auto 10px;
}

.countdown-logo img {
    width: 100%;
    height: auto;
    display: block;
}


/* Titel */
.countdown-titel {
    margin: 5px 0 5px;

    color: #FFD700;
    font-size: 2rem;

    text-shadow: 0 2px 10px rgba(0,0,0,0.7);
}


/* Uitleg */
.countdown-tekst {
    max-width: 700px;

    margin: 5px 0 15px;

    color: white;
    font-size: 1.1rem;
    line-height: 1.5;

    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}


/* Timer */
.countdown-box {
    background: rgba(0,0,0,0.4);

    border: 3px solid #FFD700;
    border-radius: 20px;

    padding: 15px 35px;
    margin: 10px 0 25px;

    box-shadow:
        0 0 20px rgba(255,215,0,0.3),
        0 5px 20px rgba(0,0,0,0.4);
}


/* Tijd */
.countdown-tijd {
    margin: 0;

    font-size: 4rem;
    line-height: 1;

    color: #FFD700;

    text-shadow:
        0 0 10px rgba(255,215,0,0.4),
        0 2px 10px rgba(0,0,0,0.7);
}


/* Beloningen tijdens countdown */
.countdown-beloningen {
    width: 100%;
    max-width: 800px;
    margin-top: 120px;
}

.countdown-beloningen .beloningen {
    margin-bottom: 20px;
}


/* Countdown afgelopen */
.afgelopen-scherm {
    min-height: 100vh;
    box-sizing: border-box;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 20px;

    text-align: center;
}

.afgelopen-logo {
    width: 100%;
    max-width: 600px;
    margin-bottom: 20px;
}

.afgelopen-logo img {
    width: 100%;
    display: block;
}

.afgelopen-scherm h1 {
    color: white;
    text-shadow: 0 2px 10px rgba(0,0,0,0.7);
}

.afgelopen-scherm p {
    max-width: 600px;
    font-size: 1.2rem;
    line-height: 1.5;
    color: white;
}


/* Mobiel */
@media (max-width: 600px) {

    .countdown-titel {
        font-size: 1.5rem;
    }

    .countdown-tekst {
        font-size: 1rem;
    }

    .countdown-tijd {
        font-size: 3.2rem;
    }

    .countdown-box {
        padding: 15px 25px;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <img src="titel.png" alt="De Grote Bankzitters Bingo Battle">
    </div>
    <h1 id="titel" class="dashboard-titel">Dashboard laden...</h1>

    <div class="card">
        <canvas id="grafiek"></canvas>
    </div>

    <div class="stats">

        <div class="stat volgers">
            <h2 id="volgers">...</h2>
            <p>Volgers</p>
        </div>

        <div class="stat positie" id="positieBlok">
            <h2 id="positie">...</h2>
            <p>Positie</p>
        </div>

    </div>

    
    <div class="afbeelding">
        <img src="teamfoto.png" alt="Teamfoto">
    </div>

    <div class="beloningen">
        <img src="bingobeloning.jpg" alt="Bingobeloningen">
    </div>

    <div class="beloningen">
        <img src="snelheidsbeloning.jpg" alt="Snelheidsbeloning">
    </div>
    
</div>

<script>


const params = new URLSearchParams(window.location.search);

const MIJN_GROEP =
    Number(params.get("groep"))

const API_URL =
"https://script.google.com/macros/s/AKfycbyB3QLZibR_SSE0WjZWTTF263Ce5m01nsejIeb_15Sfp4d1qVa3tLDu1xKMbuiMuUo/exec";

const nu = new Date();

const verbergenVanaf = new Date();
verbergenVanaf.setHours(13, 0, 0, 0);

const bingoEinde = new Date();
bingoEinde.setHours(14, 0, 0, 0);

const dashboardTerug = new Date();
dashboardTerug.setHours(14, 20, 0, 0);

if (nu >= verbergenVanaf && nu < dashboardTerug) {

    function toonScherm() {

        const nu = new Date();

        // =========================
        // COUNTDOWN
        // =========================

        if (nu < bingoEinde) {

            const verschil = bingoEinde - nu;

            const minuten = Math.floor(verschil / 1000 / 60);
            const seconden = Math.floor((verschil / 1000) % 60);

            document.body.innerHTML = `
                
                <div class="countdown-scherm">

                    <div class="countdown-content">

                        <div class="countdown-logo">
                            <img 
                                src="titel.png"
                                alt="De Grote Bankzitters Bingo Battle"
                            >
                        </div>


                        <h1 class="countdown-titel">
                            🏁 Eindsprint!
                        </h1>


                        <p class="countdown-tekst">
                            Het klassement is nu verborgen.
                            <br>
                            Jullie hebben nog tot 14:00 de tijd om Bingo in te leveren bij de CP!
                        </p>


                        <div class="countdown-box">

                            <h2 class="countdown-tijd">
                                ${minuten}:${String(seconden).padStart(2,"0")}
                            </h2>

                        </div>

                    </div>

                    <div class="countdown-beloningen">

                        <div class="beloningen">
                            <img 
                                src="bingobeloning.jpg" 
                                alt="Bingobeloningen"
                            >
                        </div>

                        <div class="beloningen">
                            <img 
                                src="snelheidsbeloning.jpg" 
                                alt="Snelheidsbeloning"
                            >
                        </div>

                    </div>

                </div>

            `;


        // =========================
        // BINGO AFGELOPEN
        // =========================

        } else {

            document.body.innerHTML = `

                <div class="afgelopen-scherm">

                    <div class="afgelopen-logo">
                        <img
                            src="titel.png"
                            alt="De Grote Bankzitters Bingo Battle"
                        >
                    </div>


                    <h1>
                        🚨 Bingo is gesloten!
                    </h1>


                    <p>
                        De Bingo's' zijn binnen.
                        <br>
                        De eindsprint zit erop!
                    </p>


                    <p>
                        Verzamel je groep bij het podium
                        voor de prijsuitreiking.
                    </p>


                    <p>
                        Na de prijsuitreiking kun je de eindstand
                        weer bekijken.
                    </p>

                </div>

            `;
        }


        // =========================
        // DASHBOARD WEER OPEN
        // =========================

        if (nu >= dashboardTerug) {
            location.reload();
        }

    }


    toonScherm();

    setInterval(toonScherm, 1000);

    throw new Error("Dashboard verborgen");
}

fetch(API_URL + "?groep=" + MIJN_GROEP)

.then(response => response.json())

.then(data => {

    document.getElementById("titel").textContent =
        data.leeftijd + " - Groep " + data.groep;

    document.getElementById("volgers").textContent =
        data.volgers;

    const positieBlok = document.getElementById("positieBlok");
    const positie = Number(data.positie);

    let positieTekst = positie + "e";

    if (positie === 1) {
        positieTekst = "🥇 1e";
        positieBlok.classList.add("goud");
    } 
    else if (positie === 2) {
        positieTekst = "🥈 2e";
        positieBlok.classList.add("zilver");
    } 
    else if (positie === 3) {
        positieTekst = "🥉 3e";
        positieBlok.classList.add("brons");
    }

    document.getElementById("positie").textContent = positieTekst;

    const labels =
        data.groepen.map(x => x.groep);

    const volgers =
        data.groepen.map(x => x.volgers);

    const kleuren =
        labels.map(g =>
            g == MIJN_GROEP
                ? "#FFD700"
                : "rgba(255,255,255,0.6)"
        );

    new Chart(
        document.getElementById("grafiek"),
        {
            type: "bar",

            data: {
                labels: labels,

                datasets: [{
                    label: "Volgers",

                    data: volgers,

                    backgroundColor: kleuren,

                    borderRadius: 6
                }]
            },

            options: {

                responsive: true,

                plugins: {

                    legend: {
                        display: false
                    }

                },

                scales: {

                    x: {
                        title: {
                            display: true,
                            text: "Groepnummer",
                            color: "white",
                            font: {
                                size: 16,
                                weight: "bold"
                            }
                        },
                        ticks: {
                            color: "white"
                        },

                        grid: {
                            display: false
                        }
                    },

                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: "Aantal volgers",
                            color: "white",
                            font: {
                                size: 16,
                                weight: "bold"
                            }
                        },
                        ticks: {
                            color: "white"
                        },

                        grid: {
                            color: "rgba(255,255,255,0.15)"
                        }
                    }

                }

            }

        }
    );

})

.catch(error => {

    document.getElementById("titel").textContent =
        "Fout bij laden";

    console.error(error);

});

</script>

</body>
</html>
