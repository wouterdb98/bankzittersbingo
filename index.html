<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kies je groep</title>

<style>
body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    color: white;

    background:
        linear-gradient(
            rgba(0,0,0,0.45),
            rgba(0,0,0,0.45)
        ),
        url("Screenshot_3.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    min-height: 100vh;

    text-align: center;
}

h1{
    margin-bottom:30px;
}

button{
    width: 140px;
    padding: 15px;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    cursor: pointer;

    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(8px);

    color: white;
}

button:hover{
    background: rgba(255,255,255,0.15);
}

#groepen{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    max-width: 900px;
    margin: 40px auto;
}

</style>
</head>
<body>

<h1>Wat is je groepsnummer?</h1>

<div id="groepen"></div>

<script>
for(let i = 29; i <= 60; i++) {
    document.getElementById("groepen").innerHTML += `
        <button onclick="openGroep(${i})">
            Groep ${i}
        </button>
    `;
}

function openGroep(groep){
    window.location.href =
        "dashboard.html?groep=" + groep;
}
</script>

</body>
</html>
